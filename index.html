<!DOCTYPE html>
<!--
  index.html - the one and only page.

  Talks to: css/*.css for looks, js/main.js to start everything, vendor/ for the libraries.

  Say it to a judge: "The whole site is one page with three scenes stacked on a fixed
  16:9 stage - the table, the recipe box and the stove - and JavaScript shows one at a time."
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- WHY viewport-fit=cover: lets the dark letterbox colour run under the iPad's
       rounded corners and home bar instead of leaving white strips. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grandma's Recipe Box</title>
  <meta name="description" content="The recipe tin every home used to have: riffle through index cards that age as you cook from them, in Grandma's early-1980s kitchen.">
  <meta name="theme-color" content="#17110d">

  <!-- Tab icon, and the icon used if the site is added to an iPad's home screen. -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- WHY: opened from the home screen, these hide Safari's address bar so the kitchen
       fills the whole iPad screen. Handy for the demo. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Open Graph: the title, blurb and picture shown when the link is shared.
       AFTER DEPLOYING: sharing sites need the picture's FULL address. Replace the two
       "assets/img/og-image.jpg" below with https://YOUR-SITE.netlify.app/assets/img/og-image.jpg -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Grandma's Recipe Box">
  <meta property="og:description" content="The recipe tin every home used to have. Pull the lamp chain and come in.">
  <meta property="og:image" content="assets/img/og-image.jpg">
  <meta property="og:image:width" content="1424">
  <meta property="og:image:height" content="752">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="assets/img/og-image.jpg">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="css/box.css">
  <link rel="stylesheet" href="css/card.css">
  <link rel="stylesheet" href="css/cook.css">
  <link rel="stylesheet" href="css/panels.css">
</head>
<body>
  <!-- The stage is always 16:9 and scales to fit the screen (see base.css). -->
  <main id="stage" class="stage">
    <section id="scene-table" class="scene is-active" aria-label="Grandma's kitchen table"></section>
    <section id="scene-box" class="scene" aria-label="The recipe box" hidden></section>
    <section id="scene-cook" class="scene" aria-label="Cooking at the stove" hidden></section>

    <!-- The title sign hangs over the dark kitchen whenever the lamp is off.
         WHY it is written here and not built by a script: it is the first thing anyone
         sees, so it should appear before any JavaScript has run. The picture is a blank
         sign; the words are real text, and they are the page's main heading. -->
    <div id="title-sign" class="title-sign">
      <img src="assets/img/obj-title-sign.png" alt="">
      <h1 class="title-sign-words">Grandma&rsquo;s<br>Recipe Box</h1>
    </div>

    <!-- Panels (almanac, binder, twine) open on top of whichever scene is showing. -->
    <div id="panels" class="panels"></div>
  </main>

  <noscript>
    <p style="position:fixed;inset:0;display:grid;place-items:center;margin:0;padding:2em;color:#f3e8cf;font:1.2em Georgia,serif;text-align:center">
      Grandma's Recipe Box needs JavaScript switched on to open the kitchen.
    </p>
  </noscript>

  <!-- WHY: GSAP and Howler are classic scripts that create the globals `gsap` and `Howl`.
       They are local copies in /vendor so the demo survives bad venue Wi-Fi.
       `defer` keeps them in order and guarantees they run before the module below. -->
  <script defer src="vendor/gsap.min.js"></script>
  <script defer src="vendor/howler.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
